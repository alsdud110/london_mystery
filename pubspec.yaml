name: world_mystery
description: "World Mystery — an offline detective mission game for kids (8-12)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  # Local persistence
  shared_preferences: ^2.5.5
  # Sound effects
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device end-to-end checks of the offline game (integration_test/).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Launcher icons: `dart run flutter_launcher_icons` (config below).
  flutter_launcher_icons: ^0.14.4
  # Native launch screens: `dart run flutter_native_splash:create`.
  flutter_native_splash: ^2.4.8
  # Deterministic padding for the Android 12 splash asset.
  image: ^4.12.0

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#151D30"
  color_dark: "#151D30"
  image: assets/branding/splash_logo.png
  image_dark: assets/branding/splash_logo.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#151D30"
    color_dark: "#151D30"
    image: assets/branding/splash_logo_android12.png
    image_dark: assets/branding/splash_logo_android12.png

# App icon, shared by both platforms. The source art
# (assets/branding/app_icon.png) draws its own rounded gold frame on white;
# app_icon_launcher_v1.png is the illustration inside that frame, cropped square
# (980px at +139+113, scaled to 1024, RGB without alpha) so the system mask
# rounds the corners instead of the drawn frame. Neither file ships in the app.
# After regenerating, revert ios/Runner.xcodeproj/project.pbxproj and the
# AppIcon Contents.json, and delete the 50/57/72px icons: v0.14.4 rewrites
# ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS to "AppIcon" and
# adds pre-iOS 7 iPad sizes. The template Contents.json names the same files.
flutter_launcher_icons:
  image_path: "assets/branding/app_icon_launcher.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Adaptive icon: the full illustration over the 72dp viewport (16% inset on
  # each side of the 108dp layer), on navyDeep (AppColors) for parallax margins.
  # No monochrome layer: the illustration has no faithful one-colour form, so
  # Android 13+ themed icons fall back to the full-colour icon.
  adaptive_icon_foreground: "assets/branding/app_icon_launcher.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_background: "#151D30"

flutter:
  uses-material-design: true
  assets:
    # Sounds: only the takes the game plays (`GameSound`, `ambienceLoops`,
    # `accentLoops` in lib/core/utils/audio_service.dart), file by file.
    # Playing another take means naming it in audio_service.dart and listing
    # it here (test/audio_assets_test.dart checks the two agree).
    - assets/sounds/processed/typewriter_key_v4_01.wav
    - assets/sounds/processed/typewriter_key_v4_02.wav
    - assets/sounds/processed/typewriter_key_v4_03.wav
    - assets/sounds/processed/typewriter_key_v4_04.wav
    - assets/sounds/processed/ui_tap_01.wav
    - assets/sounds/processed/ui_tap_02.wav
    - assets/sounds/processed/ui_tap_03.wav
    - assets/seasons/season_01_london/locations/map/
    # Season 2 Paris: its Mission Map and its cover pictures.
    - assets/seasons/season_02_paris/locations/map/
    - assets/seasons/season_02_paris/cover/
    # Case 01 (Gare du Nord): the station hall and its three clocks (no
    # hands: drawn by the app), the old clock's face, the lost ticket, the
    # brass box shut and open, and the Montmartre painting.
    - assets/seasons/season_02_paris/cases/case_01/
    - assets/seasons/season_02_paris/cases/case_02/
    - assets/seasons/season_02_paris/cases/case_03/
    - assets/seasons/season_02_paris/cases/case_04/
    - assets/seasons/season_02_paris/cases/case_05/
    - assets/seasons/season_02_paris/cases/case_06/
    - assets/seasons/season_02_paris/cases/case_07/
    - assets/seasons/season_02_paris/cases/case_08/
    - assets/seasons/season_02_paris/cases/case_09/
    - assets/seasons/season_02_paris/cases/case_10/
    - assets/seasons/season_02_paris/cases/case_11/
    - assets/seasons/season_02_paris/cases/case_12/
    - assets/seasons/season_02_paris/characters/
    # The title screen (the detective's office).
    - assets/shared/title/
    # Season hero pictures (the opening of Season 1).
    - assets/seasons/season_01_london/cover/
    # Case 01 Mission 01: King's Cross at night, searched, and its four museum
    # posters (`season1_explores.dart`).
    - assets/seasons/season_01_london/cases/case_01/
    # Case 01's Royal Box lock pictures (cut out; the delivered files in
    # symbols/original/ are kept out of the app).
    - assets/images/case01/symbols/
    # Badge medals, one per GameBadge, and the empty rosette for locked ones
    # (`ArtAssets.badges`, `ArtAssets.badgeFrame`).
    - assets/shared/badges/
    # Scene pictures: the nine landmarks, and the places inside them.
    - assets/seasons/season_01_london/locations/landmarks/
    - assets/seasons/season_01_london/locations/british_museum/
    - assets/seasons/season_01_london/locations/hyde_park/
    - assets/seasons/season_01_london/locations/buckingham_palace/
    - assets/seasons/season_01_london/locations/covent_garden/
    - assets/seasons/season_01_london/locations/kings_cross/
    - assets/seasons/season_01_london/locations/royal_archive/
    - assets/seasons/season_01_london/locations/big_ben/
    # Characters, story objects, the Raven Society mark, special pictures.
    - assets/seasons/season_01_london/characters/
    - assets/seasons/season_01_london/objects/
    - assets/shared/objects/
    - assets/seasons/season_01_london/symbols/
    - assets/seasons/season_01_london/special/
    # How to Play: the player's detective, the practice witness, the lost cat.
    - assets/shared/onboarding/
    # The player's detective: detective_boy.png and detective_girl.png
    # (until they are added, the choice shows the cap icon and the word).
    - assets/shared/detectives/avatars/
    # The player's detective in play, one picture per expression
    # (`ArtAssets.detective`, `DetectiveExpression`).
    - assets/shared/detectives/expressions/boy/
    - assets/shared/detectives/expressions/girl/

  # Bundled locally (SIL Open Font License) so the game works fully offline.
  fonts:
    # The app's reading and action face (variable: wght 200-700).
    - family: Sentient
      fonts:
        - asset: assets/fonts/Sentient-Variable.ttf
    # The names of the world: season, cases, places, documents (Regular only).
    - family: IMFellEnglishSC
      fonts:
        - asset: assets/fonts/IMFellEnglishSC-Regular.ttf
    # The storybook italic under titles (license: assets/fonts/OFL-LibreBaskerville.txt).
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
        - asset: assets/fonts/LibreBaskerville-Italic.ttf
          style: italic
