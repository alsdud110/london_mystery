name: london_mystery
description: "London Mystery — an offline detective mission game for kids (8-12)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  # Local persistence
  shared_preferences: ^2.5.5
  # QR missions (scan) + game-master QR display
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  # Sound effects
  audioplayers: ^6.8.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device checks against the DEV Firebase project (integration_test/).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Android flavors: dev (com.londonmystery.app.dev → Firebase london-mystery-dev)
  # and prod (com.londonmystery.app → london-mystery-prod). A plain
  # `flutter run` builds dev, never prod.
  default-flavor: dev

  assets:
    # Sounds: only the takes the game plays (`GameSound`, `ambienceLoops`,
    # `accentLoops` in lib/core/utils/audio_service.dart), file by file.
    # The other takes stay on disk, out of the app: the ElevenLabs originals
    # in generated/ and the candidates kept for listening. Playing another
    # take means naming it in audio_service.dart and listing it here
    # (test/audio_assets_test.dart checks the two agree).
    # The first synthesised sound still played (the finale).
    - assets/sounds/final.wav
    # Takes played as ElevenLabs made them.
    - assets/sounds/generated/padlock_open_01.wav
    - assets/sounds/generated/padlock_open_02.wav
    - assets/sounds/generated/paper_place_02.wav
    - assets/sounds/generated/puzzle_correct_v2_01.wav
    - assets/sounds/generated/puzzle_correct_v2_02.wav
    - assets/sounds/generated/puzzle_correct_v2_03.wav
    - assets/sounds/generated/puzzle_wrong_01.wav
    # App copies, trimmed / levelled from generated/.
    - assets/sounds/processed/acc_clock_mechanism_01.wav
    - assets/sounds/processed/acc_fountain_01.wav
    - assets/sounds/processed/acc_guard_march_02.wav
    - assets/sounds/processed/acc_raven_calls_01.wav
    - assets/sounds/processed/amb_grand_interior_01.wav
    - assets/sounds/processed/amb_london_night_01.wav
    - assets/sounds/processed/amb_park_01.wav
    - assets/sounds/processed/amb_river_01.wav
    - assets/sounds/processed/amb_station_02.wav
    - assets/sounds/processed/amb_tower_grounds_01.wav
    - assets/sounds/processed/amb_tower_interior_01.wav
    - assets/sounds/processed/amb_train_carriage_02.wav
    - assets/sounds/processed/big_ben_bell_01.wav
    - assets/sounds/processed/case_stamp_01.wav
    - assets/sounds/processed/case_stamp_02.wav
    - assets/sounds/processed/clock_restart_02.wav
    - assets/sounds/processed/envelope_open_v2_01.wav
    - assets/sounds/processed/envelope_open_v2_02.wav
    - assets/sounds/processed/envelope_open_v2_03.wav
    - assets/sounds/processed/lock_dial_click_01.wav
    - assets/sounds/processed/lock_dial_click_02.wav
    - assets/sounds/processed/lock_dial_click_03.wav
    - assets/sounds/processed/lock_dial_click_04.wav
    - assets/sounds/processed/lock_open_heavy_02.wav
    - assets/sounds/processed/notebook_open_01.wav
    - assets/sounds/processed/office_night_rain_v2_01.wav
    - assets/sounds/processed/paper_rustle_01.wav
    - assets/sounds/processed/pencil_note_01.wav
    - assets/sounds/processed/pin_push_02.wav
    - assets/sounds/processed/royal_box_open_02.wav
    - assets/sounds/processed/typewriter_key_v4_01.wav
    - assets/sounds/processed/typewriter_key_v4_02.wav
    - assets/sounds/processed/typewriter_key_v4_03.wav
    - assets/sounds/processed/typewriter_key_v4_04.wav
    - assets/sounds/processed/ui_tap_01.wav
    - assets/sounds/processed/ui_tap_02.wav
    - assets/sounds/processed/ui_tap_03.wav
    - assets/images/london_mystery.png
    # The title screen (the detective's office).
    - assets/images/title/
    # Season hero pictures (the opening of Season 1).
    - assets/images/season1/
    # Scene pictures: the nine landmarks, and the places inside them.
    - assets/art/scenes/landmarks/
    - assets/art/scenes/british_museum/
    - assets/art/scenes/hyde_park/
    - assets/art/scenes/buckingham_palace/
    - assets/art/scenes/covent_garden/
    - assets/art/scenes/kings_cross/
    - assets/art/scenes/royal_archive/
    - assets/art/scenes/big_ben/
    # Characters, story objects, the Raven Society mark, special pictures.
    - assets/art/characters/
    - assets/art/objects/
    - assets/art/symbols/
    - assets/art/special/

  # Bundled locally (SIL Open Font License) so the game works fully offline.
  fonts:
    # The app's reading and action face (variable: wght 200-700).
    - family: Sentient
      fonts:
        - asset: assets/fonts/Sentient-Variable.ttf
    # The names of the world: season, cases, places, documents (Regular only).
    - family: IMFellEnglishSC
      fonts:
        - asset: assets/fonts/IMFellEnglishSC-Regular.ttf
    # The storybook italic under titles (license: assets/fonts/OFL-LibreBaskerville.txt).
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
        - asset: assets/fonts/LibreBaskerville-Italic.ttf
          style: italic
